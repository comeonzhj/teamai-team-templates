# 团队 hooks：pull 后自动分发到各 AI 工具。
# 脚本由 scripts/deploy-hooks.mjs 部署到 ~/.teamai/team-scripts/（teamai.yaml 里
# requireTeamScripts: true，只允许执行该目录下的脚本）。
hooks:
  - id: session-context
    description: Every session starts from the team's live lifecycle context
    event: SessionStart
    command: 'bash -lc "~/.teamai/team-scripts/session-context.sh"'
    timeout: 10

  - id: guard-secrets
    description: Block a tool call that would leak a credential
    event: PreToolUse
    matcher: Bash|Write|Edit
    command: 'bash -lc "~/.teamai/team-scripts/guard-secrets.sh"'
    timeout: 15

  - id: guard-pii
    description: Warn when unmasked personal data (phone / ID / email) is written
    event: PreToolUse
    matcher: Write|Edit
    command: 'bash -lc "~/.teamai/team-scripts/guard-pii.sh" || true'
    timeout: 15

# 可选治理开关（写在 teamai.yaml 的 sharing.hooks 下）：
#   autoApply: false          -> pull 只提示，需手动 teamai hooks inject
#   requireTeamScripts: true  -> 只执行 ~/.teamai/team-scripts/ 下的脚本
# 成员本地紧急关闭：TEAMAI_HOOKS_DISABLED=1
