# 团队共享环境变量：pull 后写入每个成员的 env.sh（经 teamai env exec -- 使用）
variables:
  - key: TEAM_ENV
    value: staging
    description: Default environment this team's commands target (dev / staging / prod)

  - key: ISSUE_TRACKER_URL
    value: https://your-org.atlassian.net/browse
    description: Issue / requirement tracker base URL

  - key: DESIGN_SYSTEM_URL
    value: https://design.example.com
    description: Design system / Figma team library URL

  - key: PRODUCT_ANALYTICS_URL
    value: https://analytics.example.com
    description: Product analytics dashboard URL (funnel, retention, feature adoption)
