# 团队机密声明：只有 key，没有 value。
# 每位成员自己在本机设置：teamai env set JIRA_TOKEN（不回显、不落仓库）
# Agent 需要时通过 teamai env exec -- <command> 使用，永远不要问用户要明文。
secrets:
  - key: JIRA_TOKEN
    description: Issue tracker API token (read:issues, write:comments)
    url: https://id.atlassian.com/manage-profile/security/api-tokens

  - key: SENTRY_AUTH_TOKEN
    description: Sentry auth token for release health and error triage
    url: https://sentry.io/settings/auth-tokens/
