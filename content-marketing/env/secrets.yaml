# 团队机密声明（无 value，成员各自 teamai env set KEY）
secrets:
  - key: CMS_TOKEN
    description: CMS API token (publish / update articles)
    url: https://cms.example.com/settings/tokens

  - key: ANALYTICS_API_KEY
    description: Analytics read-only API key for performance reports
    url: https://analytics.example.com/settings/api

  - key: SOCIAL_PUBLISH_TOKEN
    description: Social platform publishing token (scheduled posts)
    url: https://open.example.com/app
