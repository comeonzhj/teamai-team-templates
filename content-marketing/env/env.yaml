# 团队共享环境变量
variables:
  - key: CMS_API_URL
    value: https://cms.example.com/api
    description: Content management system API base URL

  - key: ANALYTICS_DASHBOARD_URL
    value: https://analytics.example.com/content
    description: Content analytics dashboard (impressions, read-through, conversion)

  - key: BRAND_VOICE_DOC_URL
    value: https://docs.example.com/brand-voice
    description: Canonical brand voice and style guide

  - key: UTM_SOURCE_PATTERN
    value: '{channel}'
    description: UTM naming convention — channel / campaign / content placeholders

  - key: DEFAULT_REGION
    value: CN
    description: Default market region for compliance rules (CN advertising law, GDPR, ...)
