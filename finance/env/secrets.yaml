# 团队机密声明（无 value；成员各自 teamai env set KEY）
# 提醒：银行与 ERP 凭据属于高敏机密——优先使用只读/查询权限的专用账号，定期轮换。
secrets:
  - key: ERP_API_TOKEN
    description: ERP API token (read-only reporting account recommended)
    url: https://erp.example.com/admin/tokens

  - key: BANK_QUERY_TOKEN
    description: Corporate banking query token (read-only; never use a payment authority account)
    url: https://bank.example.com/corporate/settings

  - key: TAX_FILING_TOKEN
    description: E-tax filing token (filing authority — restrict holders)
    url: https://etax.example.com/setting
