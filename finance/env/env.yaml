# 团队共享环境变量
variables:
  - key: ERP_URL
    value: https://erp.example.com
    description: ERP / accounting system base URL

  - key: EXPENSE_SYSTEM_URL
    value: https://expense.example.com
    description: Expense & reimbursement system

  - key: TAX_PORTAL_URL
    value: https://etax.example.com
    description: E-tax filing portal (electronic tax bureau)

  - key: BANK_PORTAL_URL
    value: https://bank.example.com/corporate
    description: Corporate banking portal (query-only access recommended)

  - key: REPORTING_CURRENCY
    value: CNY
    description: Reporting currency (FX policy reference in accounting-standards)

  - key: CLOSE_CALENDAR_TZ
    value: Asia/Shanghai
    description: Timezone for close and filing deadlines in close-calendar.md
