# 岗位（role）定义：决定每个成员的 Agent 收到哪些 skills / rules / agents
# 成员加入后执行：teamai roles set accounting（或 fpna / tax / treasury，可逗号选多个）
#
# ★ 资源可见性设计（规范向上下游延伸）★
#   Agent 放大了每个人的产能：策划能写稿、用人经理能出面试题、业务能做预算材料。
#   因此规范的影响范围是全团队——每个岗位都拿到全部岗位的规范、SOP 与评审 Agent，
#   任何岗位的产出按同一套契约产出即可直接进入协作，不需要返工。
#   产出准入基线见根目录的产出契约规则（rules/*-output-contract.md）。
version: 1
roles:
  - id: accounting
    description: Accounting — GL, AR/AP, expense audit, monthly close, fixed assets
    resources:
      knowledge: [accounting, fpna, tax, treasury]
      skills: [common, accounting, fpna, tax, treasury]
      agents: [accounting, fpna, tax, treasury]

  - id: fpna
    description: FP&A — budgeting, rolling forecast, variance analysis, management reporting
    resources:
      knowledge: [accounting, fpna, tax, treasury]
      skills: [common, accounting, fpna, tax, treasury]
      agents: [accounting, fpna, tax, treasury]

  - id: tax
    description: Tax — filing compliance, invoicing (fapiao), tax risk and planning
    resources:
      knowledge: [accounting, fpna, tax, treasury]
      skills: [common, accounting, fpna, tax, treasury]
      agents: [accounting, fpna, tax, treasury]

  - id: treasury
    description: Treasury — cash management, forecasting, banking, internal control & audit liaison
    resources:
      knowledge: [accounting, fpna, tax, treasury]
      skills: [common, accounting, fpna, tax, treasury]
      agents: [accounting, fpna, tax, treasury]