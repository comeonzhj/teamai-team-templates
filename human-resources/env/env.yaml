# 团队共享环境变量
variables:
  - key: ATS_URL
    value: https://ats.example.com
    description: Applicant tracking system base URL

  - key: HRIS_URL
    value: https://hris.example.com
    description: HR information system base URL (org, headcount, records)

  - key: INTERVIEW_SCHEDULER_URL
    value: https://calendar.example.com/interviews
    description: Interview scheduling and feedback forms

  - key: JOB_BOARD_URL
    value: https://jobs.example.com
    description: External job board / career site publishing target

  - key: DATA_RETENTION_DAYS
    value: '180'
    description: Resume/candidate data retention window in days (check local law before changing)
