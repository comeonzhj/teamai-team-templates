# 团队机密声明（无 value；成员各自 teamai env set KEY）
secrets:
  - key: ATS_TOKEN
    description: ATS API token (candidate records — use minimal scope, read-only where possible)
    url: https://ats.example.com/settings/tokens

  - key: HRIS_API_KEY
    description: HRIS API key (headcount and org data)
    url: https://hris.example.com/developer
